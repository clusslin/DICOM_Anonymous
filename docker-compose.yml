version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: dicom-anon-backend
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/dicom_anon.db
      - SECRET_KEY=${SECRET_KEY:-change-this-secret-key-in-production}
      - DEFAULT_ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - DEFAULT_ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - DICOM_AE_TITLE=${DICOM_AE_TITLE:-DICOM_ANON}
      - DICOM_TEMP_DIR=/app/temp_dicom
      - DICOM_OUTPUT_DIR=/app/output_dicom
      - DEBUG=${DEBUG:-false}
    volumes:
      - ./data:/app/data
      - dicom_temp:/app/temp_dicom
      - dicom_output:/app/output_dicom
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      - dicom-network

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: dicom-anon-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - dicom-network

volumes:
  dicom_temp:
  dicom_output:

networks:
  dicom-network:
    driver: bridge
